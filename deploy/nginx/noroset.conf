# /etc/nginx/conf.d/noroset.conf (docs/launch-blueprint.md). گواهی‌ها در /etc/nginx/ssl با acme.sh.

limit_req_zone $binary_remote_addr zone=noroset_auth:10m rate=30r/m;

# فایل‌های عمومی norofile و _next/static نام تغییرناپذیر دارند.
proxy_cache_path /var/cache/nginx/noroset_static levels=1:2 keys_zone=noroset_static:20m max_size=3g inactive=30d use_temp_path=off;
# کش کوتاه صفحه‌ی لینک: در موج بازدید هر صفحه هر ۱۰ ثانیه فقط یک بار رندر می‌شود.
proxy_cache_path /var/cache/nginx/noroset_pages levels=1:2 keys_zone=noroset_pages:5m max_size=200m inactive=10m use_temp_path=off;

ssl_session_cache shared:noroset_ssl:10m;
ssl_session_timeout 1d;

# host ناشناس جواب نمی‌گیرد.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name _;
    ssl_reject_handshake on;
}

server {
    listen 80;
    listen [::]:80;
    server_name noroset.com www.noroset.com n8l.ir *.n8l.ir n8f.ir;

    # تأیید HTTP-01 گواهی noroset.com
    location /.well-known/acme-challenge/ {
        root /var/www/acme;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# www به دامنه‌ی اصلی: Origin هر درخواست باید با WEB_ORIGIN یکی باشد (CSRF).
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.noroset.com;

    ssl_certificate /etc/nginx/ssl/noroset.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/noroset.com/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://noroset.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name noroset.com;

    ssl_certificate /etc/nginx/ssl/noroset.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/noroset.com/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000" always;

    # سقف فایل API بیست مگابایت است.
    client_max_body_size 25M;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache noroset_static;
        proxy_cache_valid 200 30d;
        access_log off;
    }

    # فایل حذف‌شده یا خصوصی‌شده تا ۷ روز در این کش می‌ماند؛ حذف فوری تخلف: runbook.
    location /api/norofile/public/files/ {
        proxy_pass http://127.0.0.1:3001/norofile/public/files/;
        proxy_cache noroset_static;
        proxy_cache_key $uri;
        proxy_cache_valid 200 7d;
        proxy_cache_lock on;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503;
        add_header X-Cache-Status $upstream_cache_status;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    # لینک‌های کوتاه متن پیامک؛ پترن ملی‌پیامک لینک را فقط در متن ثابت می‌پذیرد.
    location = /b {
        return 302 https://noroset.com/billing;
    }

    location = /a {
        return 302 https://noroset.com/account;
    }

    location /api/auth/ {
        limit_req zone=noroset_auth burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3001/auth/;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3001/;
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name n8f.ir;

    ssl_certificate /etc/nginx/ssl/n8f.ir/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/n8f.ir/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 64k;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache noroset_static;
        proxy_cache_valid 200 30d;
        access_log off;
    }

    # پاسخ‌های فرم عمومی از همین دامنه ثبت می‌شوند؛ بقیه‌ی API بسته است.
    location /api/noroform/public/ {
        client_max_body_size 1m;
        proxy_pass http://127.0.0.1:3001/noroform/public/;
    }

    location /api/ {
        return 404;
    }

    # فرم عمومی و مشاهده‌ی پاسخ با لینک توکن‌دار؛ رندر سمت Next است.
    location / {
        proxy_pass http://127.0.0.1:3000;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name n8l.ir *.n8l.ir;

    ssl_certificate /etc/nginx/ssl/n8l.ir/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/n8l.ir/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 64k;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache noroset_static;
        proxy_cache_valid 200 30d;
        access_log off;
    }

    # آمار صفحه‌ی لینک از مرورگر روی n8l.ir می‌آید؛ بقیه‌ی /api روی این دامنه بسته است.
    location /api/norolink/public/ {
        proxy_pass http://127.0.0.1:3001/norolink/public/;
    }

    location /api/ {
        return 404;
    }

    # صفحه‌ی لینک. پاسخ Next «no-store» است و این کش فقط سمت سرور است؛ query در کلید نیست تا UTM کش را نشکند، جز
    # continue که صفحه‌ی هشدار مدیریت پلتفرم را از خود صفحه جدا می‌کند (architecture.md §9.13).
    location = / {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache noroset_pages;
        proxy_cache_key $host$arg_continue;
        proxy_ignore_headers Cache-Control Expires Set-Cookie;
        proxy_hide_header Set-Cookie;
        proxy_cache_valid 200 301 308 404 10s;
        proxy_cache_lock on;
        # ۵۰۳ اینجا عمدی است (ماژول خاموش یا سقف درخواست، با Retry-After؛ apps/web/src/lib/link-gate.ts)، پس نسخه‌ی کهنه
        # جای آن داده نمی‌شود؛ وگرنه صفحه‌ی پربازدید در حالت خاموش هم از کش نمایش داده می‌شد.
        proxy_cache_use_stale error timeout updating http_500 http_502;
        add_header X-Cache-Status $upstream_cache_status;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
    }
}
