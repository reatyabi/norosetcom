services:
  postgres:
    image: postgres:16-alpine
    container_name: noroset-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-noroset}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-noroset}
      POSTGRES_DB: ${POSTGRES_DB:-noroset}
      NOROSET_MIGRATOR_PASSWORD: ${POSTGRES_MIGRATOR_PASSWORD:-noroset_migrator_password}
      NOROSET_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:-noroset_app_password}
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/initdb/00-roles.sh:/docker-entrypoint-initdb.d/00-roles.sh:ro
      - ./packages/db/sql/roles.sql:/sql/roles.sql:ro

  # ذخیره‌ساز S3-compatible برای development (پشت norofile). production: S3 واقعی.
  # بدون پیکربندی IAM دسترسی آزاد است؛ فقط روی ماشین توسعه.
  storage:
    image: chrislusf/seaweedfs:4.48
    container_name: noroset-storage
    restart: unless-stopped
    command: server -dir=/data -s3 -s3.port=8333 -master.volumeSizeLimitMB=256
    ports:
      - '8333:8333'
    volumes:
      - storage_data:/data

volumes:
  postgres_data:
  storage_data:

