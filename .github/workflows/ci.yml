name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Check boundaries
        run: pnpm check:boundaries

      - name: Check design tokens (Nova)
        run: pnpm check:design --strict

      - name: Check contrast (AA, 5 base x 4 brand x 2 themes)
        run: pnpm check:contrast

      - name: Check file size budget
        run: pnpm check:size --strict
